#Server相关
server.port=8080
application.name=Demo

#redis相关配置
#使用StringRedisTemplate操作redis
#连接池最大连接数（使用负值表示没有限制）
spring.redis.lettuce.pool.max-active = -1
#连接池中的最大空闲连接
spring.redis.lettuce.pool.max-idle=100
#连接池中的最小空闲连接
spring.redis.lettuce.pool.min-idle=0
#连接池最大阻塞等待时间（使用负值表示没有限制）
spring.redis.lettuce.pool.max-wait=-1ms

#redis数据库链接配置
spring.redis.host=115.28.106.152
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0

#
# 连接池最大连接数（使用负值表示没有限制）
spring.redis.pool.max-active=8
# 连接池最大阻塞等待时间（使用负值表示没有限制）
spring.redis.pool.max-wait=-1
# 连接池中的最大空闲连接
spring.redis.pool.max-idle=8
# 连接池中的最小空闲连接
spring.redis.pool.min-idle=0
# 连接超时时间（毫秒）
spring.redis.timeout=0

#数据源配置
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=jdbc:mysql://115.28.106.152:3306/data_stu_db?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=UTC
spring.datasource.username=data_test
spring.datasource.password=123456

mybatis.type-aliases-package=com.example.demo.entity,com.example.demo.entity.generator.model
mybatis.mapperLocations=classpath:mappers/generator/*.xml,classpath:mappers/*.xml,classpath:mappers/generator/extend/*.xml


# 结构化配置
# CHATBI_knowledge_retrieval 场景配置
column-config.scenarios.CHATBI_knowledge_retrieval[0].column=businessType
column-config.scenarios.CHATBI_knowledge_retrieval[0].data-type=string
column-config.scenarios.CHATBI_knowledge_retrieval[0].display-name=业务类型
column-config.scenarios.CHATBI_knowledge_retrieval[0].is-display=0

column-config.scenarios.CHATBI_knowledge_retrieval[1].column=domainId
column-config.scenarios.CHATBI_knowledge_retrieval[1].data-type=int
column-config.scenarios.CHATBI_knowledge_retrieval[1].display-name=业务域ID
column-config.scenarios.CHATBI_knowledge_retrieval[1].is-display=0

column-config.scenarios.CHATBI_knowledge_retrieval[2].column=domainName
column-config.scenarios.CHATBI_knowledge_retrieval[2].data-type=string
column-config.scenarios.CHATBI_knowledge_retrieval[2].display-name=业务域名称
column-config.scenarios.CHATBI_knowledge_retrieval[2].is-display=1

column-config.scenarios.CHATBI_knowledge_retrieval[3].column=retrievalStrategy
column-config.scenarios.CHATBI_knowledge_retrieval[3].data-type=string
column-config.scenarios.CHATBI_knowledge_retrieval[3].display-name=检索策略
column-config.scenarios.CHATBI_knowledge_retrieval[3].is-display=1

column-config.scenarios.CHATBI_knowledge_retrieval[4].column=similarityThreshold
column-config.scenarios.CHATBI_knowledge_retrieval[4].data-type=double
column-config.scenarios.CHATBI_knowledge_retrieval[4].display-name=相似度阈值
column-config.scenarios.CHATBI_knowledge_retrieval[4].is-display=1

column-config.scenarios.CHATBI_knowledge_retrieval[5].column=textSimilarityWeight
column-config.scenarios.CHATBI_knowledge_retrieval[5].data-type=double
column-config.scenarios.CHATBI_knowledge_retrieval[5].display-name=文本相似度权重
column-config.scenarios.CHATBI_knowledge_retrieval[5].is-display=1

column-config.scenarios.CHATBI_knowledge_retrieval[6].column=topN
column-config.scenarios.CHATBI_knowledge_retrieval[6].data-type=int
column-config.scenarios.CHATBI_knowledge_retrieval[6].display-name=topN
column-config.scenarios.CHATBI_knowledge_retrieval[6].is-display=1

column-config.scenarios.CHATBI_knowledge_retrieval[7].column=businessCustomSize
column-config.scenarios.CHATBI_knowledge_retrieval[7].data-type=int
column-config.scenarios.CHATBI_knowledge_retrieval[7].display-name=业务习惯条数
column-config.scenarios.CHATBI_knowledge_retrieval[7].is-display=1

# CHATBI_data_analysis 场景配置
column-config.scenarios.CHATBI_data_analysis[0].column=analysisType
column-config.scenarios.CHATBI_data_analysis[0].data-type=string
column-config.scenarios.CHATBI_data_analysis[0].display-name=分析类型
column-config.scenarios.CHATBI_data_analysis[0].is-display=1

column-config.scenarios.CHATBI_data_analysis[1].column=queryTime
column-config.scenarios.CHATBI_data_analysis[1].data-type=string
column-config.scenarios.CHATBI_data_analysis[1].display-name=查询时间
column-config.scenarios.CHATBI_data_analysis[1].is-display=1


# Map<String, String> 配置
app.settings.name=MyApp
app.settings.version=1.0.0
app.settings.environment=production

# Map<String, Map<String, String>> 配置
app.nested-settings.database.host=localhost
app.nested-settings.database.port=3306
app.nested-settings.redis.host=127.0.0.1
app.nested-settings.redis.port=6379

# Map<String, List<String>> 配置
app.group-settings.admins[0]=admin1
app.group-settings.admins[1]=admin2
app.group-settings.users[0]=user1
app.group-settings.users[1]=user2
app.group-settings.users[2]=user3

# Map<String, List<FeatureConfig>> 配置
app.features.user-management[0].name=user-create
app.features.user-management[0].enabled=true
app.features.user-management[0].permissions[0]=CREATE_USER
app.features.user-management[0].permissions[1]=READ_USER
app.features.user-management[0].properties.max-retries=3

app.features.user-management[1].name=user-delete
app.features.user-management[1].enabled=false
app.features.user-management[1].permissions[0]=DELETE_USER
app.features.user-management[1].properties.confirm-required=true

app.features.data-analysis[0].name=report-generation
app.features.data-analysis[0].enabled=true
app.features.data-analysis[0].permissions[0]=GENERATE_REPORT